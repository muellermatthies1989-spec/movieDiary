<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal – Movie Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#0F1F2A", panel: "#17303F", line: "#2A4858", paper: "#E8F0EE", gold: "#F2B134", mint: "#7FD1C7" },
          fontFamily: { sans: ["Bricolage Grotesque", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="bg-ink text-paper font-sans min-h-screen">
  <header class="border-b border-line">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-xl font-extrabold tracking-tight">Movie Diary</a>
      <ul class="flex items-center gap-2 text-sm font-semibold">
        <li><a href="index.html" class="rounded-full px-4 py-2 hover:bg-panel focus-visible:outline focus-visible:outline-2 focus-visible:outline-mint">Startseite</a></li>
        <li><a href="journal.html" aria-current="page" class="rounded-full bg-gold px-4 py-2 text-ink">Journal</a></li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-10">
    <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">Dein Journal</h1>
    <p class="mt-3 text-paper/70">Alle gespeicherten Filme mit deinen Notizen. Die Daten bleiben in diesem Browser.</p>

    <p id="empty" class="mt-10 hidden rounded-xl bg-panel p-6">
      Dein Journal ist noch leer. <a href="index.html" class="font-extrabold text-gold underline underline-offset-4">Suche einen Film</a> und speichere ihn hier.
    </p>
    <ul id="journal-list" class="mt-10 flex flex-col gap-6"></ul>
  </main>

  <script src="journal.js"></script>
</body>
</html>
